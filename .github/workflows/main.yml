name: Track prices

on:
  schedule:
    # 06:00 and 18:00 Cairo time (UTC+2 winter / UTC+3 summer -- close enough)
    - cron: "0 4 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch: {}   # lets you press "Run workflow" manually in the UI

permissions:
  contents: write

concurrency:
  group: track-prices
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Capture prices
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python tracker/scrape.py

      - name: Recompute verdicts
        if: always()
        run: python tracker/verdict.py

      - name: Commit today's snapshot
        if: always()
        run: |
          git config user.name  "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/history.jsonl data/latest.json
          if git diff --staged --quiet; then
            echo "No price changes to commit."
          else
            git commit -m "prices: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          fi
